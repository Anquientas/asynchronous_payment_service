x-app: &app
  build: .
  image: payment-service
  env_file: .env
  environment:
    POSTGRES__HOST: postgres
    RABBITMQ__URL: amqp://guest:guest@rabbitmq:5672/

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__NAME}
    ports:
      - "${POSTGRES__PORT}:5432"
    volumes:
      - payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES__USERNAME}", "-d", "${POSTGRES__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrations:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:  
      postgres:
        condition: service_healthy
  
  api:
    <<: *app
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:  
      migrations:
        condition: service_completed_successfully

  relay:
    <<: *app
    command: ["python", "-m", "payment_service.bootstrap.relay"]
    restart: unless-stopped
    depends_on:  
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["python", "-m", "payment_service.bootstrap.consumer"]
    restart: unless-stopped
    depends_on:  
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  payments_data:
  rabbitmq_data: